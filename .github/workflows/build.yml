name: Build and test macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    strategy:
      matrix:
        validation-pass: [1, 2]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build universal app
        working-directory: app
        run: zsh build.sh
      - name: Test layout, windows, AI clients, music, calendar and existing regressions
        working-directory: app
        run: |
          chmod +x Tests/fixture_codex.py
          dist/DockGrove.app/Contents/MacOS/DockGrove --self-test --fixture-cli "$PWD/Tests/fixture_codex.py"
          codesign --verify --strict dist/DockGrove.app
          plutil -lint dist/DockGrove.app/Contents/Info.plist
          lipo dist/DockGrove.app/Contents/MacOS/DockGrove -verify_arch arm64
          lipo dist/DockGrove.app/Contents/MacOS/DockGrove -verify_arch x86_64
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent app/dist/DockGrove.app app/dist/DockGrove.zip
          node website/tests/site.test.mjs
          node --test website/tests/client.test.mjs
          node --test website/backend/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: DockGrove-development-universal-pass-${{ matrix.validation-pass }}
          path: app/dist/DockGrove.zip
          retention-days: 30
